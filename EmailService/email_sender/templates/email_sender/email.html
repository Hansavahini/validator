<!-- 
==============================================================================
EMAIL SERVICE UI & INTEGRATION TEMPLATE
==============================================================================
To embed/integrate this form into another web application:
1. Form Action: Point the `action` attribute of `<form>` to the EmailService endpoint (e.g. action="http://localhost:8000/").
2. Field Name: Ensure your email input field is named `name="email"`.
3. CSRF Protection: If integrating inside Django, include `{% csrf_token %}`. If integrating across domains, ensure CORS headers are enabled on the server or submit via AJAX JSON POST.
==============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon-badge {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .icon-badge svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="email"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="email"]:focus, input[type="text"]:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        input::placeholder {
            color: #64748b;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .footer-note code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: #a7f3d0;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M1.5 4.5a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 4.5v15a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 19.5v-15zM3.75 3.75a.75.75 0 00-.75.75v.518l8.36 5.573a1.5 1.5 0 001.64 0L21.75 5.018V4.5a.75.75 0 00-.75-.75H3.75zm18 3.518l-7.72 5.147a3 3 0 01-3.56 0L2.75 7.268v12.232c0 .414.336.75.75.75h16.5a.75.75 0 00.75-.75V7.268z"/>
            </svg>
        </div>
        <h2>Email Sender Service</h2>
        <p class="subtitle">Enter your email address below to dispatch a test email.</p>
    </div>

    {% if status_message %}
        <div class="alert alert-{{ status_type }}">
            {% if status_type == 'success' %}
                <span>✓</span>
            {% else %}
                <span>⚠</span>
            {% endif %}
            <div>{{ status_message }}</div>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label for="email">Recipient Email</label>
            <input type="email" id="email" name="email" value="{{ email_input }}" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit">Send Test Email</button>
    </form>

    <div class="footer-note">
        Backend mode: <code>Console / SMTP</code> | Environment ready for cross-project integration.
    </div>
</div>

</body>
</html>
